<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>花苑社区邻里购 · 阳江特产</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="assets/logo-tree.png">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============ 基础 ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#D9382E; --red-deep:#A8241C; --red-soft:#FBEAE7;
  --leaf:#3F6B45; --leaf-deep:#2C4C32; --leaf-soft:#E8F0E3; --leaf-tint:#F2F6ED;
  --pink:#D9382E; --pink-deep:#A8241C;
  --gold:#A8793F; --gold-soft:#F3EADB;
  --ink:#1C221C; --ink-2:#3D493E; --sub:#6D786C; --mute:#98A395;
  --line:#DDE5D8; --paper:#F4F7F0; --card:#FFFFFF;
  --serif:"Noto Sans SC","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  --sans:"Noto Sans SC","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  --shadow:none;
}
html,body{height:100%}
body{
  font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 620px at 12% 4%, #f4efe6 0%, rgba(244,239,230,0) 62%),
    radial-gradient(760px 700px at 88% 96%, #e9e2d6 0%, rgba(233,226,214,0) 64%),
    linear-gradient(150deg,#efece6 0%,#e4dfd6 100%);
  display:flex; align-items:center; justify-content:center; min-height:100dvh; padding:26px;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.35;
  background-image:radial-gradient(rgba(120,98,72,.18) 1px, transparent 1px);
  background-size:5px 5px; mix-blend-mode:multiply;
}
img{display:block; max-width:100%}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
input,textarea{font:inherit; color:inherit; border:0; outline:none; background:none}
svg{display:block}
.ic{width:22px;height:22px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ic--sm{width:17px;height:17px}
.ic--xs{width:14px;height:14px}

/* ============ 桌面展台 ============ */
.stage-note{position:fixed; left:48px; bottom:52px; max-width:250px; z-index:1}
.stage-kicker{font-size:11px; letter-spacing:.24em; color:#9a8f7f; margin-bottom:14px}
.stage-title{font-family:var(--serif); font-size:30px; font-weight:600; letter-spacing:.02em; color:#3a3128; line-height:1.2}
.stage-title span{display:block; font-family:var(--sans); font-size:12px; font-weight:400; letter-spacing:.2em; color:#8b7f70; margin-top:10px}
.stage-rule{width:44px;height:1px;background:#c7b9a4;margin:20px 0 16px}
.stage-list{list-style:none; font-size:12px; line-height:2; color:#7d7263}
.stage-list li::before{content:""; display:inline-block; width:4px; height:4px; border-radius:50%; background:#c2a97f; margin-right:9px; vertical-align:2px}
.stage-top{position:fixed; left:48px; top:46px; font-family:var(--serif); font-size:13px; letter-spacing:.22em; color:#8d8272; z-index:1}
@media (max-width:1080px){.stage-note,.stage-top{display:none}}

/* ============ 设备 ============ */
.device{
  position:relative; width:min(402px,100vw); height:min(858px,100dvh);
  flex:0 0 auto; min-width:0; max-width:100vw;
  background:var(--paper); border-radius:36px; overflow:hidden; isolation:isolate;
  border:1px solid rgba(80,60,40,.14);
  box-shadow:0 60px 100px -46px rgba(52,38,24,.55), 0 10px 26px -18px rgba(52,38,24,.4), inset 0 0 0 1px rgba(255,255,255,.6);
  display:flex; flex-direction:column;
}
@media (max-width:520px){
  body{padding:0}
  body::after{display:none}
  .device{width:100vw; height:100dvh; border-radius:0; border:0; box-shadow:none}
}

/* ============ 状态栏 / 胶囊 ============ */
.statusbar{
  flex:none; height:28px; display:flex; align-items:center; justify-content:space-between;
  padding:0 22px 0 26px; font-size:12px; font-weight:600; letter-spacing:.02em;
  position:relative; z-index:30; transition:background .2s, color .2s;
  background:#fff; color:var(--ink);
}
.device.theme-pink .statusbar{background:#FF3F6C; color:#fff}
.device.theme-red .statusbar{background:#E23B33; color:#fff}
.device.theme-leaf .statusbar{background:var(--leaf-soft); color:var(--leaf-deep)}
.sb-icons{display:flex; align-items:center; gap:5px; height:12px; opacity:.95}
.sb-icons svg{width:15px; height:11px; stroke:currentColor; fill:currentColor; stroke-width:0}
.sb-batt{width:22px;height:11px;border:1px solid currentColor;border-radius:2.5px;position:relative;fill:none!important}
.sb-batt::after{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:72%;background:currentColor;border-radius:1px}
.sb-batt::before{content:"";position:absolute;right:-3px;top:3px;height:5px;width:2px;background:currentColor;border-radius:0 1px 1px 0}
.capsule{
  display:flex; align-items:center; height:28px; padding:0 8px 0 11px; gap:9px;
  border-radius:15px; background:rgba(255,255,255,.82); border:1px solid rgba(0,0,0,.07);
  box-shadow:0 1px 2px rgba(0,0,0,.04); flex:none;
}
.capsule .dots{font-size:8px; letter-spacing:2.5px; color:#3a3733; line-height:1; padding-right:1px}
.capsule .cap-sep{width:1px; height:12px; background:rgba(0,0,0,.12)}
.capsule .ring{width:14px; height:14px; border-radius:50%; border:1px solid rgba(0,0,0,.42); display:grid; place-items:center}
.capsule .ring i{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.55)}
.device.theme-pink .capsule, .device.theme-red .capsule{background:rgba(255,255,255,.26); border-color:rgba(255,255,255,.32)}
.device.theme-pink .capsule .dots, .device.theme-red .capsule .dots{color:#fff}
.device.theme-pink .capsule .cap-sep, .device.theme-red .capsule .cap-sep{background:rgba(255,255,255,.4)}
.device.theme-pink .capsule .ring, .device.theme-red .capsule .ring{border-color:rgba(255,255,255,.7)}
.device.theme-pink .capsule .ring i, .device.theme-red .capsule .ring i{background:rgba(255,255,255,.85)}

/* ============ 视口 ============ */
.viewport{position:relative; flex:1; min-height:0; overflow:hidden}
#view{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
#view.with-tab{padding-bottom:74px}
#view.with-dock{padding-bottom:82px}
#view.with-both{padding-bottom:142px}
#dock{position:absolute; left:0; right:0; bottom:0; z-index:26; pointer-events:none}
#dock > *{pointer-events:auto}

/* ============ 导航 ============ */
.nav{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
  padding:6px 12px 10px; background:rgba(255,255,255,.94); backdrop-filter:blur(12px);
  border-bottom:1px solid transparent;
}
.nav--line{border-bottom-color:var(--line)}
.nav-title{position:absolute; left:50%; transform:translateX(-50%); font-family:var(--serif); font-size:16.5px; font-weight:600; letter-spacing:.04em; white-space:nowrap}
.nav-back{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;flex:none;color:var(--ink);margin-left:-4px}
.nav-back:active{background:rgba(0,0,0,.05)}
.nav-spacer{flex:1}
.nav-right{display:flex;align-items:center;gap:6px}

.brand{display:flex; align-items:center; gap:9px; flex:none}
.brand-mark{
  width:34px;height:34px;border-radius:10px;overflow:hidden;
  display:block;box-shadow:0 4px 10px -4px rgba(200,42,32,.55);flex:none;
}
.brand-mark img{width:100%;height:100%;display:block;object-fit:cover}
.brand-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand-name{font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.03em;line-height:1;white-space:nowrap}
.brand-sub{font-size:9px;color:var(--leaf-deep);letter-spacing:.14em;line-height:1;white-space:nowrap}
.nav--home{padding:7px 12px 11px;background:linear-gradient(180deg,#F3F8EF 0%,var(--leaf-soft) 100%);border-bottom-color:rgba(78,122,82,.12);gap:8px}
.searchbar{
  flex:1; min-width:0; height:31px; border-radius:16px; background:#FCFDFA;
  display:flex; align-items:center; gap:6px; padding:0 12px; color:var(--mute);
  font-size:11.5px; letter-spacing:.01em; border:1px solid rgba(78,122,82,.14);
}
.searchbar .ic{width:14px;height:14px;flex:none}
.searchbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ 首页 · 轮播 ============ */
.hero{position:relative; margin:0 12px 14px; height:198px; border-radius:16px; overflow:hidden; box-shadow:var(--shadow); background:#2a1c14}
.hero-slide{position:absolute; inset:0; opacity:0; transition:opacity .7s ease; display:block; width:100%; text-align:left}
.hero-slide.is-on{opacity:1}
.hero-slide img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center right}
.hero-scrim{position:absolute; inset:0; background:linear-gradient(96deg, rgba(24,15,11,.9) 0%, rgba(24,15,11,.7) 42%, rgba(24,15,11,.18) 74%, rgba(24,15,11,.02) 100%)}
.hero-copy{position:relative; z-index:2; padding:24px 0 0 20px; max-width:72%}
.hero-kicker{display:inline-flex; align-items:center; gap:7px; font-size:10px; letter-spacing:.18em; color:#F0D6A6}
.hero-kicker::before{content:"";width:16px;height:1px;background:#F0D6A6}
.hero-title{font-family:var(--serif); font-size:23px; line-height:1.32; font-weight:600; color:#fff; margin-top:9px; letter-spacing:.03em; text-shadow:0 2px 12px rgba(0,0,0,.3)}
.hero-sub{font-size:11px; color:rgba(255,255,255,.72); margin-top:7px; letter-spacing:.04em}
.hero-cta{
  margin-top:14px; height:29px; padding:0 16px; border-radius:15px; background:#fff; color:var(--red-deep);
  font-size:11.5px; font-weight:600; letter-spacing:.04em; display:inline-flex; align-items:center; gap:6px;
  box-shadow:0 6px 16px -8px rgba(0,0,0,.6);
}
.hero-dots{position:absolute; z-index:3; right:14px; bottom:12px; display:flex; gap:5px}
.hero-dot{width:12px;height:3px;border-radius:2px;background:rgba(255,255,255,.34);transition:.3s}
.hero-dot.is-on{background:#fff; width:18px}

/* ============ 首页 · 分类宫格 ============ */
.quick-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px 4px; padding:2px 8px 16px; background:#fff}
.quick-item{display:flex; flex-direction:column; align-items:center; gap:7px}
.quick-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--leaf-soft);color:var(--leaf-deep);box-shadow:inset 0 0 0 1px rgba(78,122,82,.10);transition:transform .15s}
.quick-item:nth-child(even) .quick-ic{background:var(--leaf-tint)}
.quick-item:active .quick-ic{transform:scale(.94)}
.quick-ic .ic{width:23px;height:23px;stroke-width:1.6}
.quick-label{font-size:11.5px; color:var(--ink-2); letter-spacing:.02em; white-space:nowrap}

/* ============ 首页 · 秒杀 ============ */
.flash{margin:0 12px 16px; background:var(--card); border-radius:14px; padding:13px 12px 12px; box-shadow:var(--shadow)}
.flash-head{display:flex; align-items:center; gap:8px}
.flash-title{font-family:var(--serif); font-size:16px; font-weight:700; letter-spacing:.04em; color:var(--ink)}
.flash-badge{font-size:9.5px; color:#9a6b2c; background:var(--gold-soft); border-radius:3px; padding:2px 5px; letter-spacing:.08em}
.flash-clock{display:flex; align-items:center; gap:4px; margin-left:2px}
.flash-clock span{font-family:var(--serif); font-size:11px; font-weight:700; color:#fff; background:#2C2723; border-radius:3px; padding:2px 3px; letter-spacing:.02em; font-variant-numeric:tabular-nums}
.flash-clock i{font-style:normal;font-size:10px;color:var(--mute)}
.flash-more{margin-left:auto; font-size:11px; color:var(--mute); display:flex; align-items:center; gap:1px}
.flash-track{display:flex; gap:9px; overflow-x:auto; margin-top:11px; scrollbar-width:none; padding-bottom:1px}
.flash-track::-webkit-scrollbar{display:none}
.flash-item{flex:none; width:92px}
.flash-img{width:92px;height:92px;object-fit:cover;border-radius:9px;background:#F2EFEA}
.flash-name{font-size:11.5px; line-height:1.34; color:var(--ink-2); margin-top:7px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; height:31px}
.flash-price{display:flex; align-items:baseline; gap:4px; margin-top:4px}
.flash-price b{font-family:var(--serif); font-size:14px; color:var(--red); font-weight:700}
.flash-price b i{font-style:normal;font-size:10px;margin-right:1px}
.flash-price s{font-size:10px; color:var(--mute)}

/* ============ 商品卡片 ============ */
.p-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 12px}
.p-card{background:var(--card); border-radius:12px; overflow:hidden; box-shadow:0 4px 14px -10px rgba(58,42,28,.4); display:flex; flex-direction:column}
.p-card:active{transform:scale(.995)}
.p-media{position:relative; aspect-ratio:1/1; background:#F3F0EB; overflow:hidden}
.p-media img{width:100%;height:100%;object-fit:cover}
.p-tag{position:absolute; left:7px; top:7px; font-size:9.5px; letter-spacing:.02em; padding:2px 6px; border-radius:4px; background:rgba(255,255,255,.92); color:var(--red-deep); box-shadow:0 1px 4px rgba(0,0,0,.08)}
.p-tag--dark{background:rgba(31,28,25,.72); color:#F6E9D0; backdrop-filter:blur(4px)}
.p-body{padding:8px 9px 9px; display:flex; flex-direction:column; flex:1}
.p-name{font-size:13px; line-height:1.4; font-weight:500; color:var(--ink); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:36px}
.p-meta{display:flex; align-items:center; justify-content:space-between; margin-top:6px}
.p-sold{font-size:10px; color:var(--mute)}
.p-price-row{display:flex; align-items:flex-end; justify-content:space-between; margin-top:7px; gap:6px}
.price{font-family:var(--serif); color:var(--red); font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.01em; display:flex; align-items:baseline; gap:1px; line-height:1}
.price i{font-style:normal; font-size:11px; font-weight:600; margin-right:1px}
.price .int{font-size:17px}
.price .dec{font-size:11px; font-weight:600}
.price s{font-family:var(--sans); font-size:10px; color:var(--mute); margin-left:4px; font-weight:400}
.add-btn{width:27px;height:27px;border-radius:8px; background:var(--red-soft); color:var(--red); display:grid; place-items:center; flex:none; transition:transform .12s}
.add-btn:active{transform:scale(.9)}
.add-btn .ic{width:15px;height:15px}
.add-btn--lg{width:31px;height:31px;border-radius:50%}
.buy-btn{height:25px; padding:0 12px; border-radius:13px; background:var(--red); color:#fff; font-size:11px; font-weight:500; letter-spacing:.04em; flex:none}

/* ============ 首页区块 ============ */
.sec{margin-top:18px}
.sec-head{display:flex; align-items:baseline; gap:8px; padding:0 14px 10px}
.sec-title{font-family:var(--serif); font-size:17px; font-weight:700; letter-spacing:.06em; color:var(--ink); flex:none}
.sec-sub{font-size:9.5px; letter-spacing:.12em; color:var(--mute); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sec-more{margin-left:auto; font-size:11px; color:var(--mute); display:flex; align-items:center; gap:0; flex:none; padding-left:6px}
.sec-more .ic{width:12px;height:12px}
.sec--mine{margin-top:4px}
.brand-foot{margin-top:26px; background:#24382A; color:#DCE6D8; padding:30px 24px 26px; position:relative; overflow:hidden}
.brand-foot::before{content:""; position:absolute; left:-40px; top:-60px; width:200px;height:200px;border-radius:50%; background:radial-gradient(circle, rgba(126,166,125,.26), transparent 68%)}
.bf-name{font-family:var(--serif); font-size:21px; letter-spacing:.24em; color:#F2F7EF; font-weight:600}
.bf-sub{font-size:10px; letter-spacing:.18em; color:#A9BFA5; margin-top:9px}
.bf-desc{font-size:12px; line-height:1.9; color:#C3D2C0; margin-top:16px; max-width:280px}
.bf-badges{display:flex; gap:16px; margin-top:20px; padding-top:16px; border-top:1px solid rgba(255,255,255,.12)}
.bf-badge{font-size:10.5px; color:#CFDDCB; letter-spacing:.06em; display:flex; align-items:center; gap:5px}
.bf-badge::before{content:"";width:4px;height:4px;background:#9CBE97;border-radius:50%}

/* ============ 分类页 ============ */
.cat-page{min-height:100%}
.cat-circles{display:flex; gap:14px; overflow-x:auto; padding:4px 14px 14px; background:#fff; scrollbar-width:none}
.cat-circles::-webkit-scrollbar{display:none}
.cat-circle{flex:none; width:52px; display:flex; flex-direction:column; align-items:center; gap:5px}
.cat-circle-ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#F6F3EE;border:2px solid transparent;transition:.2s}
.cat-circle-ic .ic{width:23px;height:23px;stroke:#6E6358}
.cat-circle.is-on .cat-circle-ic{border-color:var(--red);background:#FDF1EF}
.cat-circle.is-on .ic{stroke:var(--red)}
.cat-circle-label{font-size:10.5px; color:var(--sub); white-space:nowrap; max-width:56px; overflow:hidden; text-overflow:ellipsis}
.cat-circle.is-on .cat-circle-label{color:var(--red); font-weight:500}
.cat-body{display:grid; grid-template-columns:94px minmax(0,1fr); align-items:start}
.cat-side{background:#F3F1EC; padding:4px 0 24px; position:sticky; top:0}
.side-item{position:relative; padding:14px 6px 14px 12px; font-size:12px; color:var(--sub); line-height:1.25; letter-spacing:.02em; text-align:left; display:block; width:100%}
.side-item.is-on{background:#fff; color:var(--red); font-weight:500}
.side-item.is-on::before{content:""; position:absolute; left:0; top:13px; bottom:13px; width:3px; background:var(--red); border-radius:2px}
.cat-main{background:#fff; min-height:520px; padding-bottom:20px}
.sortbar{display:flex; align-items:center; padding:10px 12px 8px; gap:16px; position:sticky; top:0; background:#fff; z-index:5}
.sort-item{font-size:12px; color:var(--sub); display:flex; align-items:center; gap:3px; position:relative; padding-bottom:3px}
.sort-item.is-on{color:var(--red); font-weight:500}
.sort-item.is-on::after{content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--red); border-radius:1px}
.sort-item .arrows{display:flex;flex-direction:column;gap:1px}
.sort-item .arrows i{font-style:normal;font-size:8px;line-height:.7;color:var(--mute)}
.sort-item.is-on .arrows i{color:var(--red)}
.cat-count{margin-left:auto; font-size:10.5px; color:var(--mute)}
.cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:2px 10px 0}
.cat-card .p-name{font-size:12.5px; min-height:34px}
.cat-card .price .int{font-size:16px}
.cat-empty{padding:60px 20px; text-align:center; color:var(--mute); font-size:12px}
.cat-search{padding:0 12px 12px; background:#fff}

/* ============ 详情页 ============ */
.detail-page{background:#fff; min-height:100%}
.detail-top{position:absolute; left:0; right:0; top:0; z-index:10; display:flex; align-items:center; gap:8px; padding:8px 12px}
.detail-back{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.detail-hero{position:relative; width:100%; aspect-ratio:1/1; background:#F3F0EB}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-price{background:linear-gradient(180deg,#fff 0%,#fff 100%); padding:15px 16px 14px; position:relative}
.dp-row{display:flex; align-items:flex-end; gap:8px}
.dp-price{font-family:var(--serif); color:var(--red); font-weight:700; display:flex; align-items:baseline; font-variant-numeric:tabular-nums}
.dp-price i{font-style:normal;font-size:16px;margin-right:2px}
.dp-price .int{font-size:31px; line-height:.95}
.dp-price .dec{font-size:15px}
.dp-orig{font-size:11px; color:var(--mute); text-decoration:line-through; padding-bottom:3px}
.dp-save{font-size:10px; color:#9a6b2c; background:var(--gold-soft); padding:2px 6px; border-radius:3px; margin-left:2px; margin-bottom:3px}
.dp-name{font-size:16.5px; line-height:1.5; font-weight:600; margin-top:10px; letter-spacing:.01em}
.dp-meta{display:flex; align-items:center; gap:14px; margin-top:9px; font-size:10.5px; color:var(--mute)}
.dp-meta b{color:var(--sub); font-weight:500}
.service-bar{display:flex; gap:16px; margin:12px 16px 0; padding:11px 12px; background:#FAF8F4; border-radius:8px; font-size:10.5px; color:var(--sub)}
.service-bar span{display:flex; align-items:center; gap:4px}
.service-bar .ic{width:12px;height:12px;stroke:var(--gold)}
.detail-block{margin:16px 16px 0; padding-top:16px; border-top:1px solid var(--line)}
.block-head{display:flex; align-items:center; gap:8px; margin-bottom:11px}
.block-title{font-family:var(--serif); font-size:15px; font-weight:600; letter-spacing:.04em}
.block-more{margin-left:auto; font-size:10.5px; color:var(--mute); display:flex; align-items:center}
.rev-score{display:flex; align-items:baseline; gap:6px; font-size:11px; color:var(--mute)}
.rev-score b{font-family:var(--serif); font-size:18px; color:var(--red); font-weight:700}
.rev-item{padding:10px 0; border-bottom:1px dashed #F2EEE8}
.rev-item:last-child{border-bottom:0; padding-bottom:2px}
.rev-top{display:flex; align-items:center; gap:7px}
.rev-avatar{width:22px;height:22px;border-radius:50%;background:#EFEAE2;display:grid;place-items:center;font-size:10px;color:#8b7c69}
.rev-name{font-size:11.5px; color:var(--ink-2)}
.rev-stars{margin-left:auto; display:flex; gap:1px; color:var(--gold)}
.rev-stars svg{width:9px;height:9px;fill:currentColor;stroke:none}
.rev-text{font-size:11.5px; line-height:1.7; color:var(--sub); margin-top:6px}
.rev-spec{font-size:10px; color:var(--mute); margin-top:4px}
.detail-article{margin:20px 0 0; background:#FAF8F4; padding:22px 16px}
.art-kicker{font-size:10px; letter-spacing:.18em; color:var(--gold)}
.art-title{font-family:var(--serif); font-size:19px; line-height:1.5; margin-top:8px; letter-spacing:.04em}
.art-text{font-size:12px; line-height:2; color:var(--sub); margin-top:10px}
.art-img{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:6px; margin-top:16px}
.spec-table{margin-top:16px; width:100%; table-layout:fixed; border-collapse:collapse; font-size:11px}
.spec-table col{width:26%}
.spec-table col:last-child{width:74%}
.spec-table tr{border-bottom:1px solid #EFEAE2}
.spec-table th{text-align:left; padding:8px 0; color:var(--mute); font-weight:400}
.spec-table td{padding:8px 0; color:var(--ink-2); word-break:break-word}
.detail-actions{
  display:flex; align-items:center; gap:6px; padding:8px 10px; padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  background:rgba(255,255,255,.97); border-top:1px solid var(--line); backdrop-filter:blur(10px);
}
.da-icon{width:42px; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink-2); position:relative}
.da-icon .ic{width:20px;height:20px}
.da-icon span{font-size:9px; color:var(--mute)}
.da-icon .badge{position:absolute; top:-3px; right:7px; min-width:14px;height:14px;border-radius:7px;background:var(--red);color:#fff;font-size:9px;display:grid;place-items:center;padding:0 3px}
.da-main{flex:1; display:flex; gap:6px; margin-left:2px}
.btn-cart{flex:1;height:40px;border-radius:20px;background:#3A342F;color:#fff;font-size:12.5px;font-weight:500;letter-spacing:.06em}
.btn-buy{flex:1;height:40px;border-radius:20px;background:linear-gradient(135deg,#F04A3C,#D51F24);color:#fff;font-size:12.5px;font-weight:500;letter-spacing:.06em;box-shadow:0 6px 16px -8px rgba(213,31,36,.7)}

/* ============ 底部导航 / 结算条 ============ */
.tabbar{
  display:flex; align-items:stretch; background:rgba(255,255,255,.97); backdrop-filter:blur(14px);
  border-top:1px solid #EAE6E0; padding-bottom:env(safe-area-inset-bottom,0px);
}
.tab-item{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:8px 0 7px; color:#8A8278; position:relative}
.tab-item.is-on{color:var(--red)}
.tab-ic{position:relative; display:grid; place-items:center}
.tab-ic .ic{width:22px;height:22px;stroke-width:1.7}
.tab-label{font-size:10.5px; letter-spacing:.04em}
.tab-badge{position:absolute; top:-6px; right:-12px; min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;display:grid;place-items:center;padding:0 4px;font-weight:500}
.cart-bar{
  display:flex; align-items:center; gap:10px; padding:9px 12px; background:#fff; border-top:1px solid var(--line);
  padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));
}
.cs-all{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--sub)}
.cbx{width:18px;height:18px;border-radius:50%;border:1.2px solid #D5CEC4;display:grid;place-items:center;background:#fff;flex:none}
.cbx.is-on{border-color:var(--red);background:var(--red)}
.cbx.is-on svg{stroke:#fff;fill:none;stroke-width:2}
.cbx svg{width:11px;height:11px;stroke:transparent;stroke-width:2;fill:none}
.cs-total{margin-left:auto; text-align:right; line-height:1.2}
.cs-total .price .int{font-size:18px}
.cs-total small{display:block; font-size:9px; color:var(--mute); margin-top:2px}
.cs-btn{height:36px; padding:0 20px; border-radius:18px; background:linear-gradient(135deg,#F0473A,#D61F26); color:#fff; font-size:12px; font-weight:500; letter-spacing:.04em}
.cs-btn:disabled{opacity:.45}

/* ============ 空状态 ============ */
.empty{padding:44px 20px 8px; display:flex; flex-direction:column; align-items:center; text-align:center}
.empty-art{width:132px; height:112px; position:relative}
.empty-title{font-size:13px; color:var(--sub); margin-top:12px; letter-spacing:.02em}
.empty-sub{font-size:11px; color:var(--mute); margin-top:5px; line-height:1.7}
.empty-btn{margin-top:16px; height:34px; padding:0 22px; border-radius:17px; border:1px solid var(--red); color:var(--red); font-size:12px; background:#fff}

/* ============ 购物车 ============ */
.cart-page{min-height:100%; background:var(--paper)}
.cart-tip{margin:0 12px 10px; padding:9px 12px; background:#FCF5E8; color:#8b6523; font-size:10.5px; border-radius:8px; display:flex; align-items:center; gap:6px}
.cart-tip .ic{width:13px;height:13px;stroke:#b98a3e}
.cart-list{margin:0 12px; background:#fff; border-radius:12px; overflow:hidden}
.cart-item{display:flex; gap:10px; padding:12px; border-bottom:1px solid #F4F1EC; align-items:flex-start}
.cart-item:last-child{border-bottom:0}
.cart-item .cbx{margin-top:30px}
.cart-thumb{width:76px;height:76px;border-radius:8px;object-fit:cover;background:#F3F0EB;flex:none}
.cart-info{flex:1; min-width:0}
.cart-name{font-size:12.5px; line-height:1.42; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cart-spec{align-self:flex-start; display:inline-flex; font-size:9.5px; color:var(--mute); background:#F7F5F1; border-radius:3px; padding:2px 6px; margin-top:6px}
.cart-row{display:flex; align-items:flex-end; justify-content:space-between; margin-top:8px}
.cart-row .price .int{font-size:16px}
.stepper{display:flex; align-items:center; border:1px solid #EDEAE4; border-radius:4px; overflow:hidden; background:#fff}
.stepper button{width:24px;height:24px;display:grid;place-items:center;color:var(--sub)}
.stepper button:active{background:#F7F5F1}
.stepper .val{min-width:26px; text-align:center; font-size:12px; font-variant-numeric:tabular-nums; border-left:1px solid #EDEAE4; border-right:1px solid #EDEAE4; line-height:24px}
.stepper .ic{width:11px;height:11px}
.cart-del{font-size:10px; color:var(--mute); padding:4px; margin-left:2px}

/* ============ 订单列表 ============ */
.order-page{background:var(--bg,#F7F6F3); min-height:100%}
.order-search{padding:6px 12px 10px; background:#fff; display:flex; align-items:center; gap:10px}
.order-search .searchbar{height:32px; flex:1}
.order-filter{font-size:11.5px; color:var(--sub); flex:none}
.order-tabs{display:flex; background:#fff; padding:0 6px; position:sticky; top:0; z-index:8; border-bottom:1px solid #F4F1EC}
.otab{flex:1; text-align:center; padding:11px 0 10px; font-size:12.5px; color:var(--sub); position:relative}
.otab.is-on{color:var(--ink); font-weight:600}
.otab.is-on::after{content:""; position:absolute; left:50%; transform:translateX(-50%); bottom:0; width:20px; height:2.5px; background:var(--red); border-radius:2px}
.order-list{padding:12px}
.order-card{background:#fff; border-radius:12px; margin-bottom:12px; overflow:hidden; box-shadow:0 4px 14px -12px rgba(58,42,28,.4)}
.oc-head{display:flex; align-items:center; padding:12px 13px 9px; font-size:11px; color:var(--mute)}
.oc-no{margin-right:8px; letter-spacing:.02em}
.oc-status{margin-left:auto; color:var(--red); font-size:11.5px; font-weight:500}
.oc-body{padding:0 13px 4px; display:flex; gap:10px; align-items:flex-start}
.oc-thumb{width:64px;height:64px;border-radius:7px;object-fit:cover;background:#F3F0EB}
.oc-goods{flex:1; min-width:0}
.oc-name{font-size:12px; line-height:1.45; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oc-spec{font-size:10px;color:var(--mute); margin-top:5px}
.oc-qty{font-size:10px; color:var(--mute); margin-top:4px}
.more-goods{font-size:10px;color:var(--mute);padding:8px 13px 0}
.oc-foot{display:flex; align-items:center; padding:10px 13px 12px; gap:7px}
.oc-total{font-size:10.5px; color:var(--sub)}
.oc-total b{font-family:var(--serif); font-size:14px; color:var(--ink); font-weight:600; margin-left:3px}
.oc-actions{margin-left:auto; display:flex; gap:7px; align-items:center}
.btn-outline{height:27px; padding:0 12px; border-radius:14px; border:1px solid #DCD5CA; font-size:11px; color:var(--sub); display:inline-flex; align-items:center}
.btn-solid{height:27px; padding:0 13px; border-radius:14px; background:var(--red); color:#fff; font-size:11px}
.btn-ghost{height:27px; padding:0 4px; font-size:10.5px; color:var(--mute); border-bottom:1px dashed #D8D0C4}
.order-empty{}

/* ============ 会员中心 ============ */
.mine-head{position:relative; padding:12px 16px 0; background:linear-gradient(128deg,#FF3F6C 0%,#F02A4E 38%,#E4202C 100%); color:#fff; border-radius:0 0 16px 16px; overflow:hidden}
.mine-head::after{content:""; position:absolute; right:-40px; top:-70px; width:210px;height:210px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.18), transparent 64%); pointer-events:none}
.mine-tools{display:flex; justify-content:flex-end; gap:14px; position:relative; z-index:2}
.tool-btn{color:rgba(255,255,255,.92); position:relative}
.tool-btn .ic{width:19px;height:19px}
.mine-user{display:flex; align-items:center; gap:12px; margin-top:10px; position:relative; z-index:2; padding-right:96px}
.avatar{width:54px;height:54px;border-radius:50%;background:#F0EDE8;overflow:hidden;border:2px solid rgba(255,255,255,.42);flex:none;display:grid;place-items:center}
.avatar svg{width:38px;height:38px}
.mine-name{font-family:var(--serif); font-size:16.5px; font-weight:600; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mine-level{font-size:9.5px; color:rgba(255,255,255,.72); margin-top:5px; letter-spacing:.06em}
.mine-ticket{position:absolute; right:16px; top:58px; width:92px; padding:8px 10px; border-radius:5px; background:rgba(120,10,26,.42); border:1px solid rgba(255,255,255,.18); z-index:2}
.mine-ticket::before,.mine-ticket::after{content:""; position:absolute; width:7px;height:7px;border-radius:50%; background:#F02A4E; top:50%; margin-top:-3.5px}
.mine-ticket::before{left:-4px}
.mine-ticket::after{right:-4px}
.mine-ticket b{display:block; font-size:10px; font-weight:500; color:#FFE2C4}
.mine-ticket span{display:block; font-size:8.5px; color:rgba(255,255,255,.62); margin-top:3px}
.mine-balance{display:flex; align-items:center; gap:6px; margin:16px -16px 0; padding:9px 18px 10px; background:rgba(0,0,0,.12); border-top:1px solid rgba(255,255,255,.12); font-size:11px; color:rgba(255,255,255,.86); position:relative; z-index:2}
.mine-balance .wallet-ic{width:14px;height:14px;stroke:#FFD9A8}
.mine-balance b{font-family:var(--serif); font-size:13px; color:#fff; font-weight:600}
.balance-link{margin-left:auto; font-size:10px; color:#FFE1B9; display:flex; align-items:center}
.panel{background:#fff; border-radius:12px; margin:12px; padding:13px}
.panel-head{display:flex; align-items:baseline; padding:0 1px 4px}
.panel-title{font-family:var(--serif); font-size:15.5px; font-weight:600; letter-spacing:.04em}
.panel-more{margin-left:auto; font-size:10.5px; color:var(--mute); display:flex; align-items:center}
.order-shortcuts{display:grid; grid-template-columns:repeat(5,1fr); padding:12px 0 3px}
.os-item{display:flex; flex-direction:column; align-items:center; gap:7px; color:var(--ink-2); position:relative}
.os-item .ic{width:23px;height:23px;stroke:#6B6156;stroke-width:1.5}
.os-label{font-size:10.5px; color:var(--sub)}
.os-badge{position:absolute; top:-5px; right:12px; min-width:14px;height:14px;border-radius:7px;background:var(--red);color:#fff;font-size:9px;display:grid;place-items:center;padding:0 3px}
.func-grid{display:grid; grid-template-columns:repeat(5,1fr); padding:12px 0 3px}
.func-item{display:flex; flex-direction:column; align-items:center; gap:7px}
.func-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.func-ic .ic{width:19px;height:19px;stroke-width:1.6}
.func-label{font-size:10px; color:var(--sub); white-space:nowrap}

/* ============ 个人资料 / 列表页 ============ */
.list-page{background:var(--paper); min-height:100%; padding-bottom:26px}
.row-group{background:#fff; margin:12px; border-radius:12px; overflow:hidden}
.row-group--slim{margin-top:0; border-radius:0 0 12px 12px}
.row-item{display:flex; align-items:center; width:100%; padding:15px 14px; font-size:13px; color:var(--ink); border-bottom:1px solid #F5F2ED; text-align:left; background:#fff; min-height:50px}
.row-item:last-child{border-bottom:0}
.row-label{flex:none; letter-spacing:.02em}
.row-value{margin-left:auto; color:var(--mute); font-size:12.5px; max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right}
.row-chev{margin-left:6px; color:#C8C0B4; display:grid; place-items:center}
.row-chev .ic{width:13px;height:13px}
.row-avatar{margin-left:auto; width:40px;height:40px;border-radius:50%;background:#EFEBE4;display:grid;place-items:center;overflow:hidden}
.row-avatar svg{width:28px;height:28px}
.logout-btn{margin:18px 12px 0; width:calc(100% - 24px); height:46px; border-radius:10px; background:#fff; color:var(--red); font-size:13px; letter-spacing:.06em}
.profile-note{font-size:10px; color:var(--mute); text-align:center; margin-top:14px; line-height:1.8}

/* ============ 余额 ============ */
.balance-page{background:var(--paper); min-height:100%}
.bal-head{background:linear-gradient(125deg,#FF3F6C,#F02A4E 46%,#E3202C); padding:6px 16px 58px; color:#fff; position:relative}
.bal-head .nav{background:transparent; position:static; padding:4px 0 8px}
.bal-head .nav-title{color:#fff}
.bal-card{
  margin:-46px 14px 0; background:#fff; border-radius:13px; padding:18px 16px 16px; position:relative; z-index:2;
  box-shadow:0 14px 34px -24px rgba(120,20,20,.65);
}
.bal-label{font-size:11px; color:var(--mute); letter-spacing:.04em}
.bal-num{font-family:var(--serif); font-size:40px; font-weight:600; color:var(--ink); line-height:1.2; margin-top:8px; font-variant-numeric:tabular-nums}
.bal-num small{font-size:15px; color:var(--sub); margin-right:4px; font-weight:400}
.bal-actions{display:flex; justify-content:space-around; margin-top:16px; padding-top:16px; border-top:1px solid #F3F0EA}
.bal-act{display:flex; flex-direction:column; align-items:center; gap:8px}
.bal-act-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#FF7A45,#F43F2E);color:#fff;box-shadow:0 6px 14px -8px rgba(244,63,46,.7)}
.bal-act-ic--alt{background:linear-gradient(135deg,#FFC24B,#F39511);box-shadow:0 6px 14px -8px rgba(243,149,17,.7)}
.bal-act-ic .ic{width:20px;height:20px;stroke:#fff}
.bal-act-label{font-size:11px; color:var(--sub)}
.bal-rows{background:#fff; margin:12px; border-radius:12px; overflow:hidden}
.bal-row{display:flex; align-items:center; width:100%; padding:16px 14px; font-size:13px; border-bottom:1px solid #F5F2ED; background:#fff}
.bal-row:last-child{border-bottom:0}
.bal-row .row-value{color:var(--mute)}
.ledger{background:#fff; margin:12px; border-radius:12px; overflow:hidden}
.ledger-head{padding:13px 14px 6px; font-size:11px; color:var(--mute); letter-spacing:.04em}
.ledger-item{display:flex; align-items:center; padding:12px 14px; border-top:1px solid #F7F5F1; font-size:12px}
.ledger-type{color:var(--ink-2)}
.ledger-time{font-size:10px; color:var(--mute); margin-top:4px}
.ledger-amt{margin-left:auto; font-family:var(--serif); font-size:15px; color:var(--red); font-weight:600}
.ledger-amt--out{color:var(--ink-2)}

/* ============ 绑定手机 ============ */
.bind-page{min-height:100%; background:linear-gradient(160deg,#F1503F 0%,#E73630 52%,#DA2723 100%); display:flex; flex-direction:column; color:#fff; position:relative; overflow:hidden}
.bind-page::before{content:""; position:absolute; left:-60px; top:-40px; width:240px;height:240px;border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.14),transparent 66%)}
.bind-page .nav{position:relative; z-index:3; background:transparent; padding:6px 12px 8px}
.bind-page .nav .nav-back{color:#fff}
.bind-body{flex:1; display:flex; flex-direction:column; align-items:center; padding:26px 30px 0; position:relative; z-index:2}
.bind-logo{width:64px;height:64px;border-radius:16px;background:#fff;display:grid;place-items:center;padding:5px;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.bind-logo img{width:54px;height:54px;border-radius:11px;display:block}
.bind-name{font-family:var(--serif); font-size:17px; letter-spacing:.08em; margin-top:14px; font-weight:500}
.bind-actions{width:100%; margin-top:106px; display:flex; flex-direction:column; gap:14px}
.bind-btn{height:47px; border-radius:24px; background:#fff; color:#E5352E; font-size:14px; font-weight:600; letter-spacing:.1em; box-shadow:0 12px 26px -14px rgba(0,0,0,.4)}
.bind-btn--ghost{background:rgba(255,255,255,.22); color:#fff; border:1px solid rgba(255,255,255,.5); box-shadow:none}
.bind-hint{margin-top:auto; padding:26px 0 34px; font-size:10px; color:rgba(255,255,255,.66); letter-spacing:.04em; text-align:center; line-height:1.9}
.bind-hint b{display:block; color:#FFE7BE; font-weight:500; margin-bottom:4px}

/* ============ 确认订单 ============ */
.checkout-page{background:var(--paper); min-height:100%; padding-bottom:8px}
.addr-card{margin:12px; background:#fff; border-radius:12px; padding:14px; display:flex; gap:11px; align-items:center; position:relative; overflow:hidden}
.addr-card::after{content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:repeating-linear-gradient(90deg,#E23B33 0 8px,transparent 8px 14px,#C79A54 14px 22px,transparent 22px 28px); opacity:.55}
.addr-ic{width:32px;height:32px;border-radius:50%;background:#FDF0EC;display:grid;place-items:center;flex:none}
.addr-ic .ic{width:16px;height:16px;stroke:var(--red)}
.addr-info{flex:1; min-width:0}
.addr-name{font-size:13px; display:flex; align-items:center; gap:8px}
.addr-name b{font-weight:600}
.addr-name span{font-size:11px; color:var(--sub); font-weight:400}
.addr-detail{font-size:11.5px; color:var(--sub); line-height:1.6; margin-top:5px}
.addr-empty{font-size:12px;color:var(--mute)}
.co-goods{margin:0 12px; background:#fff; border-radius:12px; overflow:hidden}
.co-good{display:flex; gap:10px; padding:12px; border-bottom:1px solid #F6F3EE}
.co-good:last-child{border-bottom:0}
.co-thumb{width:62px;height:62px;border-radius:7px;object-fit:cover;background:#F3F0EB}
.co-info{flex:1; min-width:0}
.co-name{font-size:12px; line-height:1.45; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.co-spec{font-size:10px;color:var(--mute);margin-top:5px}
.co-right{text-align:right; flex:none}
.co-right .price .int{font-size:14px}
.co-right small{display:block;font-size:10px;color:var(--mute);margin-top:5px}
.co-rows{margin:12px; background:#fff; border-radius:12px; overflow:hidden}
.co-row{display:flex; align-items:center; padding:14px; font-size:12.5px; border-bottom:1px solid #F7F5F1}
.co-row:last-child{border-bottom:0}
.co-row .label{color:var(--ink-2); flex:none}
.co-row .value{margin-left:auto; color:var(--sub); font-size:11.5px; text-align:right; display:flex; align-items:center; gap:4px}
.co-row .value em{font-style:normal; color:var(--red)}
.co-row .value .ic{width:12px; height:12px}
.co-note{width:100%; margin:12px; background:#fff; border-radius:12px; padding:13px 14px; font-size:12px; display:flex; gap:10px; align-items:baseline; border:0}
.co-note input{flex:1; font-size:12px; color:var(--ink); min-width:0}
.co-note input::placeholder{color:var(--mute)}
.co-bar{display:flex; align-items:center; gap:10px; padding:9px 12px; background:#fff; border-top:1px solid var(--line); padding-bottom:calc(9px + env(safe-area-inset-bottom,0px))}
.co-bar .cs-total{text-align:left; margin-left:0}
.co-bar .cs-total small{display:inline; margin-left:6px}
.co-submit{margin-left:auto; height:38px; padding:0 22px; border-radius:19px; background:linear-gradient(135deg,#F0473A,#D61F26); color:#fff; font-size:12.5px; font-weight:500}

/* ============ 搜索 ============ */
.search-page{background:var(--paper); min-height:100%}
.search-top{display:flex; align-items:center; gap:8px; padding:8px 12px 10px; background:#fff; position:sticky; top:0; z-index:10}
.search-field{flex:1; height:33px; border-radius:17px; background:#F3F1EC; display:flex; align-items:center; gap:7px; padding:0 12px}
.search-field .ic{width:15px;height:15px;stroke:var(--mute);flex:none}
.search-field input{flex:1; font-size:12px; min-width:0}
.search-cancel{font-size:12.5px; color:var(--sub); flex:none; padding:4px}
.hot-wrap{padding:16px 16px 6px}
.hot-title{font-size:11px; color:var(--mute); letter-spacing:.06em; margin-bottom:11px}
.hot-words{display:flex; flex-wrap:wrap; gap:8px}
.hot-word{font-size:11.5px; color:var(--ink-2); background:#fff; border:1px solid #EDEAE4; border-radius:15px; padding:5px 12px}
.hot-word--hot{color:var(--red); border-color:#F4D7D1; background:#FDF3F1}
.search-results{padding-top:6px}
.search-count{font-size:10.5px; color:var(--mute); padding:8px 14px 10px}
.search-empty{padding:56px 20px; text-align:center; color:var(--mute); font-size:12px}
.search-empty .empty-art{margin:0 auto}

/* ============ 底部弹层 ============ */
.sheet-layer{position:absolute; inset:0; z-index:60; pointer-events:none}
.sheet-layer.is-open{pointer-events:auto}
.sheet-mask{position:absolute; inset:0; background:rgba(20,14,10,.46); opacity:0; transition:opacity .25s; backdrop-filter:blur(1px)}
.sheet-layer.is-open .sheet-mask{opacity:1}
.sheet{
  position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:18px 18px 0 0;
  transform:translateY(102%); transition:transform .3s cubic-bezier(.3,.8,.35,1); max-height:88%;
  display:flex; flex-direction:column; box-shadow:0 -14px 40px rgba(30,20,10,.16);
}
.sheet-layer.is-open .sheet{transform:translateY(0)}
.sheet-head{display:flex; align-items:flex-start; padding:16px 16px 10px; gap:10px; flex:none}
.sheet-title{font-family:var(--serif); font-size:16px; font-weight:600; letter-spacing:.03em}
.sheet-desc{font-size:10.5px; color:var(--mute); margin-top:5px; line-height:1.6}
.sheet-close{position:absolute; right:12px; top:12px; width:26px;height:26px;border-radius:50%;background:#F4F1EC;display:grid;place-items:center;color:var(--sub)}
.sheet-close .ic{width:12px;height:12px}
.sheet-body{padding:0 16px 12px; overflow-y:auto; min-height:0}
.sheet-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px)); display:flex; gap:10px; flex:none; background:#fff; border-top:1px solid #F5F2ED}
.sheet-btn{flex:1; height:42px; border-radius:21px; font-size:13px; font-weight:500; letter-spacing:.04em}
.sheet-btn--dark{background:#3A342F; color:#fff}
.sheet-btn--red{background:linear-gradient(135deg,#F0473A,#D61F26); color:#fff}
.sheet-btn--light{background:#F5F2ED; color:var(--sub)}
.sheet-btn:disabled{opacity:.5}

.sku-head{display:flex; gap:12px; padding:16px 16px 4px}
.sku-thumb{width:82px;height:82px;border-radius:8px;object-fit:cover;background:#F3F0EB}
.sku-price{font-family:var(--serif); font-size:22px; color:var(--red); font-weight:700; display:flex; align-items:baseline}
.sku-price i{font-style:normal;font-size:12px;margin-right:2px}
.sku-stock{font-size:10px; color:var(--mute); margin-top:7px}
.sku-name{font-family:var(--serif); font-size:12.5px; line-height:1.5; color:var(--ink); margin-top:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.sku-section{padding:14px 0 0}
.sku-label{font-size:11.5px; color:var(--sub); margin-bottom:9px; letter-spacing:.04em}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{padding:7px 13px; border-radius:16px; background:#F6F3EE; font-size:11.5px; color:var(--sub); border:1px solid transparent}
.chip.is-on{background:#FDF0ED; color:var(--red); border-color:#F2CFC7; font-weight:500}
.qty-row{display:flex; align-items:center; margin-top:16px}
.qty-row .sku-label{margin:0}
.qty-row .stepper{margin-left:auto}
.sku-tip{font-size:9.5px; color:var(--mute); margin-top:12px; line-height:1.7}
.sheet-form{padding-top:14px; display:flex; flex-direction:column; gap:10px}
.field{display:flex; align-items:center; gap:10px; background:#F7F5F1; border-radius:8px; padding:0 12px; height:42px}
.field label{font-size:11.5px; color:var(--mute); flex:none; width:52px}
.field input{flex:1; font-size:12.5px; min-width:0; height:100%}
.field--code{padding-right:4px}
.field--code button{flex:none; height:30px; padding:0 10px; border-radius:15px; background:#FDEAE5; color:var(--red); font-size:10.5px}
.field--code button:disabled{background:#F2EFEA;color:var(--mute)}
.option-list{display:flex; flex-direction:column; gap:8px}
.option{height:44px; border-radius:8px; background:#F7F5F1; display:flex; align-items:center; padding:0 14px; font-size:12.5px; color:var(--ink-2)}
.option.is-on{background:#FDF0ED; color:var(--red); font-weight:500}
.option::after{content:"";margin-left:auto;width:14px;height:14px;border-radius:50%;border:1px solid #D8D0C4}
.option.is-on::after{border-color:var(--red);background:var(--red);box-shadow:inset 0 0 0 2px #fff}
.coupon-ticket{display:flex; gap:12px; padding:12px; border-radius:10px; background:#FDF5EE; border:1px solid #F3E4D3; margin-bottom:9px; position:relative}
.coupon-amt{font-family:var(--serif); font-size:26px; color:var(--red); font-weight:700; display:flex; align-items:baseline; min-width:74px}
.coupon-amt i{font-style:normal; font-size:11px; margin-right:1px}
.coupon-info{flex:1}
.coupon-name{font-size:12px; color:var(--ink)}
.coupon-meta{font-size:10px; color:var(--mute); margin-top:6px; line-height:1.6}
.coupon-state{font-size:10.5px; color:var(--red); align-self:center}
.coupon-ticket.is-off{opacity:.5}
.amounts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.amount{height:48px; border-radius:9px; background:#F7F5F1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
.amount.is-on{background:#FDF0ED; border:1px solid #F2CFC7}
.amount b{font-family:var(--serif); font-size:17px; color:var(--ink); font-weight:600}
.amount span{font-size:9px; color:var(--mute)}
.amount.is-on b{color:var(--red)}
.pay-list{display:flex; flex-direction:column; gap:9px}
.pay-item{display:flex; align-items:center; gap:10px; padding:13px; border-radius:9px; background:#F8F6F2}
.pay-item .ic{width:19px;height:19px;stroke:#3D8A5A}
.pay-item span{font-size:12px}
.pay-item b{margin-left:auto; font-size:10px; color:var(--mute); font-weight:400}
.dlg-card{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.94); width:266px; background:#fff; border-radius:14px; overflow:hidden; opacity:0; transition:.22s}
.sheet-layer.is-open .dlg-card{opacity:1; transform:translate(-50%,-50%) scale(1)}
.dlg-body{padding:24px 22px 20px; text-align:center}
.dlg-title{font-family:var(--serif); font-size:15px; font-weight:600}
.dlg-text{font-size:11.5px; color:var(--sub); line-height:1.7; margin-top:9px}
.dlg-foot{display:flex; border-top:1px solid #F0ECE5}
.dlg-btn{flex:1; height:44px; font-size:13px; color:var(--sub)}
.dlg-btn--main{color:var(--red); font-weight:500; border-left:1px solid #F0ECE5}

/* ============ 轻提示 ============ */
.toast{
  position:absolute; left:50%; bottom:96px; transform:translate(-50%,10px); z-index:80;
  background:rgba(28,24,20,.92); color:#fff; font-size:11.5px; padding:9px 16px; border-radius:18px;
  opacity:0; pointer-events:none; transition:.24s; max-width:78%; text-align:center; line-height:1.5; letter-spacing:.02em;
}
.toast.is-on{opacity:1; transform:translate(-50%,0)}

/* ============ 通用空态插画 ============ */
.empty-art svg{width:100%;height:100%}

/* ============ 细节补正 ============ */
input::placeholder{color:#A9A297}
.searchbar input{background:none;border:0;outline:none;color:var(--ink)}
.field input[type="date"]{color:var(--ink);-webkit-appearance:none;appearance:none}
.pay-item{border:1px solid transparent}
.pay-item.is-on{border-color:#F2CFC7;background:#FDF0ED}
.rev-stars .is-off{opacity:.24}
.coupon-state:disabled{color:var(--mute);cursor:default}
.order-card .btn-ghost{border-bottom:0;color:#B5637B;padding:0 4px}
.amount.is-on span{color:var(--red)}
.addr-card{width:calc(100% - 24px); text-align:left}
.co-note .ic{flex:none;stroke:var(--mute)}
.stepper button:disabled{opacity:.4}

/* ================= 扁平化主题 · 叶绿辅色 ================= */
body{background:#E8EDE3; background-image:none;}
body::after{display:none}
.stage-top,.stage-kicker{color:#6E7C69; letter-spacing:.18em}
.stage-title{font-family:var(--sans); color:#2C4C32; font-weight:700}
.stage-title span{font-family:var(--sans); color:#7E8C79}

.stage-list{color:#687563}
.stage-list li::before{background:#3F6B45}
.device{border-radius:18px; border:1px solid #C7D3C1; box-shadow:none; background:var(--paper)}

.statusbar{background:#fff; color:var(--ink)}

.capsule{background:#fff; border:1px solid #D5DED1; box-shadow:none; backdrop-filter:none}

.device.theme-leaf .capsule .ring i{background:rgba(44,76,50,.7)}
.nav{background:#fff; backdrop-filter:none; border-bottom:1px solid var(--line)}
.nav--home{background:var(--leaf); border-bottom-color:var(--leaf-deep); gap:8px}
.brand-mark{width:36px;height:36px;border-radius:8px;box-shadow:none;border:1px solid rgba(255,255,255,.32)}
.brand-name{color:var(--ink)}

.nav--home .capsule{background:#fff; border-color:#fff}
.nav--home .capsule .dots{color:#2C4C32}

.nav-title{font-family:var(--sans); font-weight:700; letter-spacing:.02em}
.hero{height:176px; margin:0 12px 14px; border-radius:8px; border:1px solid var(--leaf-deep); background:var(--leaf); box-shadow:none}
.hero-slide{display:block}
.hero-slide img{position:absolute; inset:0 0 0 auto; width:42%; height:100%; object-fit:contain; padding:10px; background:var(--leaf-soft); border-left:1px solid rgba(255,255,255,.18); box-sizing:border-box}
.hero-scrim{display:none}
.hero-copy{position:relative; z-index:2; max-width:58%; padding:18px 0 0 16px}

.hero-cta{height:28px; border-radius:4px; background:#fff; color:var(--leaf-deep); box-shadow:none; font-weight:700; font-size:11px}

.hero-dot{background:rgba(255,255,255,.35)}
.hero-dot.is-on{background:#fff}
.quick-grid{background:#fff; padding:14px 8px 16px; gap:14px 4px; border-bottom:1px solid var(--line)}
.quick-ic{width:42px;height:42px;border-radius:8px;background:var(--leaf);color:#fff;box-shadow:none}
.quick-item:nth-child(even) .quick-ic{background:var(--leaf)}
.quick-ic .ic{width:21px;height:21px;stroke:#fff;stroke-width:1.7}
.quick-label{font-size:11px; color:var(--ink-2); letter-spacing:0}
.flash{background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:none; padding:12px}
.flash-title{font-family:var(--sans); font-size:15px; font-weight:700; letter-spacing:.02em}
.flash-badge{background:var(--leaf-soft); color:var(--leaf-deep); border-radius:2px; font-size:9px}
.flash-clock span{background:#2C4C32; border-radius:2px}
.flash-img{border-radius:4px; background:#fff}
.flash-price b{font-family:var(--sans); font-size:14px}
.flash-price{flex-direction:column; align-items:flex-start; gap:1px}

.sec{margin-top:16px}
.sec-title{font-family:var(--sans); font-size:15px; font-weight:700; letter-spacing:.02em}

.p-grid{gap:9px; padding:0 12px}

.price{font-family:var(--sans); color:var(--red)}

.add-btn{width:27px;height:27px;border-radius:4px;background:var(--leaf);color:#fff}

.buy-btn{height:26px;border-radius:4px;background:var(--leaf);color:#fff;font-size:11px}

.bf-desc{color:#D7E4D2; font-size:11.5px; line-height:1.85; margin-top:13px}

.cat-circle.is-on .cat-circle-ic{background:var(--leaf-deep);border-color:var(--red)}

.cat-circle-label{font-size:10.5px; color:var(--sub); max-width:58px}

.cat-side{display:none}
.sortbar{background:#fff; border-bottom:1px solid var(--line); padding:10px 14px}

.sort-item.is-on{color:var(--red); font-weight:600}
.sort-item.is-on::after{background:var(--red)}
.cat-count{color:var(--mute); font-size:10px}
.cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:10px 12px 0}
.cat-card .p-name{font-size:12.5px}
.detail-page{background:#fff}

.detail-price{background:#fff}

.dp-orig{color:var(--mute)}

/* -------- 路由 -------- */
let currentView = null, currentParams = {};
function parseHash(){
  const raw = (location.hash || '#/home').replace(/^#\/?/, '') || 'home';
  const [path, qs] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  const view = parts[0] || 'home';
  const params = {};
  parts.slice(1).forEach((v, i) => { params['p' + (i + 1)] = decodeURIComponent(v); });
  if(qs){
    qs.split('&').forEach(pair => {
      const k = pair.split('=')[0];
      if(k) params[decodeURIComponent(k)] = decodeURIComponent(pair.split('=')[1] || '');
    });
  }
  return { view, params };
}
function navigate(view, params = {}){
  const qs = Object.keys(params).filter(k => params[k] !== undefined && params[k] !== null && params[k] !== '')
    .map(k => `${encodeURIComponent(k)}=${encodeURIComponent(params[k])}`).join('&');
  const next = `#/${view}${qs ? '?' + qs : ''}`;
  if(location.hash === next){ render(); }
  else location.hash = next;
}
function go(view){ navigate(view, {}); }
function back(){
  if(location.hash && location.hash !== '#/home'){ history.back(); }
  else navigate('home');
}
function render(){
  const { view, params } = parseHash();
  const first = view !== currentView;
  currentView = view; currentParams = params;
  const device = $('#device');
  device.className = 'device ' + (['mine','balance','bind'].includes(view) ? 'theme-leaf' : '');
  const fn = VIEWS[view] || VIEWS.home;
  $('#view').innerHTML = fn(params);
  renderDock(view);
  if(first) $('#view').scrollTop = 0;
  stopHero();
  if(view === 'home'){ startHero(); initCleanHero(); }
  syncProductArt();
  if(view === 'category') { /* 分类页滚动由浏览器保持 */ }
}

/* -------- 首页满幅海报：圆点指引 + 鼠标横滚 -------- */
function initCleanHero(){
  const car = document.querySelector('.clean-carousel');
  if(!car) return;
  const dots = Array.from(document.querySelectorAll('.clean-dot'));
  let raf = null;
  const sync = () => {
    const w = car.clientWidth || 1;
    const idx = Math.max(0, Math.min(dots.length - 1, Math.round(car.scrollLeft / w)));
    dots.forEach((d, i) => d.classList.toggle('is-on', i === idx));
  };
  car.addEventListener('scroll', () => {
    if(raf) return;
    raf = requestAnimationFrame(() => { raf = null; sync(); });
  }, { passive: true });
  dots.forEach((dot, i) => dot.addEventListener('click', () => {
    car.scrollTo({ left: i * car.clientWidth, behavior: 'smooth' });
    sync();
  }));
  car.addEventListener('wheel', (e) => {
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    e.preventDefault();
    car.scrollLeft += e.deltaY;
  }, { passive: false });
  let down = false, startX = 0, startLeft = 0, dragged = false;
  car.addEventListener('pointerdown', (e) => {
    if(e.pointerType !== 'mouse') return;
    down = true; dragged = false; startX = e.clientX; startLeft = car.scrollLeft;
    car.classList.add('is-dragging');
    car.setPointerCapture(e.pointerId);
  });
  car.addEventListener('pointermove', (e) => {
    if(!down) return;
    const dx = e.clientX - startX;
    if(Math.abs(dx) > 5) dragged = true;
    car.scrollLeft = startLeft - dx;
  });
  const endDrag = () => {
    if(!down) return;
    down = false; car.classList.remove('is-dragging');
  };
  car.addEventListener('pointerup', endDrag);
  car.addEventListener('pointercancel', endDrag);
  car.addEventListener('click', (e) => {
    if(!dragged) return;
    e.preventDefault(); e.stopPropagation(); dragged = false;
  }, true);
  sync();
}

function openSheet(html, cls = ''){
  const layer = $('#sheetLayer');
  layer.innerHTML = `<div class="sheet-mask" data-act="closeSheet"></div>${html}`;
  layer.classList.add('is-open');
}
function closeSheet(){
  const layer = $('#sheetLayer');
  layer.classList.remove('is-open');
  setTimeout(() => { if(!layer.classList.contains('is-open')) layer.innerHTML = ''; }, 280);
}
let toastTimer = null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-on'), 1900);
}
function dialog(title, text, okText, onOk){
  openSheet(`<div class="dlg-card">
    <div class="dlg-body">
      <p class="dlg-title">${esc(title)}</p>
      <p class="dlg-text">${esc(text)}</p>
    </div>
    <div class="dlg-foot">
      <button class="dlg-btn" data-act="closeSheet">取消</button>
      <button class="dlg-btn dlg-btn--main" data-act="dialogOk">${esc(okText || '确定')}</button>
    </div>
  </div>`);
  pendingDialog = onOk;
}

function selectedCouponInfo(subtotal){
  const id = state.selectedCoupon;
  if(!id) return null;
  const c = state.coupons.find(x => x.id === id);
  if(!c || state.usedCoupons.includes(c.id)) return null;
  if(subtotal < c.min) return null;
  return c;
}

  shipping: { text:'待发货', tab:'shipping' },

function orderTime(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function createOrderNo(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return 'HY' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + Math.floor(Math.random() * 90 + 10);
}

/* -------- 启动 -------- */
function tickClock(){
  const d = new Date();
  const el = $('#clock');
  if(el) el.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function boot(){
  tickClock();
  setInterval(tickClock, 30000);
  window.addEventListener('hashchange', render);
  render();
  resumeHelpJobs();
}

const VIEWS = {};

function flashRemain(){
  const now = new Date();
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
  return Math.max(0, Math.floor((end - now) / 1000));
}
function updateFlashClock(){
  const remain = flashRemain();
  const p = n => String(n).padStart(2, '0');
  $$('.flash-clock [data-unit]').forEach(el => {
    const u = el.dataset.unit;
    el.textContent = p(u === 'h' ? Math.floor(remain / 3600) : u === 'm' ? Math.floor(remain / 60) % 60 : remain % 60);
  });
}
setInterval(updateFlashClock, 1000);

VIEWS.category = (params = {}) => {
  const cat = params.cat || '全部';
  const sort = params.sort || 'default';

  let list = cat === '全部' ? PRODUCTS.slice() : group ? PRODUCTS.filter(p => group.includes(p.cat)) : PRODUCTS.filter(p => p.cat === cat);
  if(sort === 'catalog') list.sort((a, b) => a.seq - b.seq);
  else if(sort === 'priceAsc') list.sort((a, b) => a.price - b.price);

function approveHelpPost(id){
  const p = helpPost(id);
  if(!p || p.status !== 'pending') return;
  p.status = 'approved';
  p.taskId = 'ht' + Date.now();
  state.helpTasks.unshift({
    id:p.taskId, title:p.title, type:p.type, desc:p.desc, area:p.area || '花苑社区', time:p.time || '时间待沟通',
    points:p.points, quota:p.quota, claimed:0, joined:false, done:false, verified:false, postId:p.id
  });
  saveState();
  if(currentView === 'help') softRender();
  toast('你的求助已通过核实，已进入任务池');
}
function awardHelpTask(id){
  const t = helpTask(id);
  if(!t || !t.done || t.verified) return;
  t.verified = true;
  state.points = (state.points || 0) + t.points;
  state.pointsLog.unshift({ label:'邻里帮 · ' + t.title, delta:t.points, date:orderTime(Date.now()).slice(0, 10) });
  saveState();
  if(currentView === 'help' || currentView === 'mine' || currentView === 'pointsMall') softRender();
  toast(`积分已到账 +${t.points}，可去「花苑积分」兑换`);
}
function resumeHelpJobs(){
  state.helpPosts.filter(p => p.status === 'pending').forEach(p => {
    const wait = Math.max(0, 2400 - (Date.now() - (p.createdAt || Date.now())));
    setTimeout(() => approveHelpPost(p.id), wait);
  });
  state.helpTasks.filter(t => t.done && !t.verified).forEach(t => {
    const wait = Math.max(0, 2000 - (Date.now() - (t.completedAt || Date.now())));
    setTimeout(() => awardHelpTask(t.id), wait);
  });
}

function checkoutTotals(){
  const items = checkedItems();
  const subtotal = items.reduce((s, it) => s + BY_ID[it.id].price * it.qty, 0);
  const coupon = selectedCouponInfo(subtotal);
  const freight = subtotal > 0 && subtotal < 99 ? 8 : 0;
  const total = Math.max(0, subtotal + freight - (coupon ? coupon.amt : 0));
  return { items, subtotal, coupon, freight, total };
}
function addToCart(id, spec, qty, check = true){
  const key = id + '::' + spec;
  const exist = state.cart.find(it => it.key === key);
  if(exist) exist.qty = Math.min(99, exist.qty + qty);
  else state.cart.push({ key, id, spec, qty: Math.min(99, qty), checked: check });
  saveState();
}

/* -------- 事件分发 -------- */
const ACTIONS = {
  back(){ back(); },
  go(el){ navigate(el.dataset.view); },
  goHome(){ navigate('home'); },
  helpTab(el){ navigate('help', { tab:el.dataset.tab || 'open' }); },
  openHelpForm(){ openHelpForm(); },
  submitHelp(){

      id:'hp' + Date.now(), title, desc,
      type:$('#helpType') ? $('#helpType').value : '生活帮忙',
      points:$('#helpPoints') ? Number($('#helpPoints').value) : 25,

      time:$('#helpTime') ? ($('#helpTime').value.trim() || '时间可协商') : '时间可协商',
      photos:helpUploads.length, status:'pending', createdAt:Date.now(), taskId:null
    };
    state.helpPosts.unshift(p);
    saveState(); closeSheet(); softRender(); toast('已提交，社区后台核实后会进入任务池');
    setTimeout(() => approveHelpPost(p.id), 2600);
  },
  claimHelp(el){
    const t = helpTask(el.dataset.id);
    if(!t || t.joined || t.done || t.verified) return;
    if((t.claimed || 0) >= t.quota) return toast('这个任务名额已满');
    t.joined = true; t.claimed = (t.claimed || 0) + 1;
    saveState(); softRender(); toast('已领取，完成后记得回来提交');
  },
  completeHelp(el){
    const t = helpTask(el.dataset.id);
    if(!t || !t.joined || t.done) return;
    t.done = true; t.completedAt = Date.now();
    saveState(); softRender(); toast('已提交完成，后台核实后发放积分');
    setTimeout(() => awardHelpTask(t.id), 2200);
  },
  removeHelpPhoto(el){
    const i = Number(el.dataset.idx);
    helpUploads.splice(i, 1);
    const box = $('#helpPhotoPreview');
    if(box) box.innerHTML = helpPhotoGridHTML();
  },
  redeemPoints(el){
    const g = POINTS_GOODS.find(x => x.pid === el.dataset.id);
    const p = g ? BY_ID[g.pid] : null;
    if(!g || !p) return;
    if((state.points || 0) < g.cost) return toast('积分不足，去做邻里帮任务吧');
    dialog('兑换积分好物', `确认使用 ${g.cost} 积分兑换「${p.name}」？兑换后由社区驿站登记发放。`, '确认兑换', () => {
      if((state.points || 0) < g.cost){ toast('积分不足'); return; }
      state.points -= g.cost;
      state.pointsLog.unshift({ label:'积分兑换 · ' + p.name, delta:-g.cost, date:orderTime(Date.now()).slice(0, 10) });
      state.pointsOrders.unshift({ id:'po' + Date.now(), pid:p.id, name:p.name, cost:g.cost, time:orderTime(Date.now()), status:'待发货' });
      saveState(); softRender(); toast('兑换成功，可在积分明细中查看');
    });
  },
  spinRecipe(){
    if(slotSpinning) return;
    const dishEl = $('#slotDish'), lever = $('#slotLever');
    if(!dishEl) return;
    slotSpinning = true;
    dishEl.classList.add('is-spinning');
    if(lever) lever.classList.add('is-pulling');
    const pool = RECIPES;
    let ticks = 0;
    const spinTimer = setInterval(() => {
      const r = pool[Math.floor(Math.random() * pool.length)];
      const el = $('#slotDish');
      if(el) el.textContent = r.dish;
      ticks++;
    }, 70);
    setTimeout(() => {
      clearInterval(spinTimer);
      const r = pool[Math.floor(Math.random() * pool.length)];
      const el = $('#slotDish');
      if(el){ el.textContent = r.dish; el.classList.remove('is-spinning'); }
      const lv = $('#slotLever');
      if(lv) lv.classList.remove('is-pulling');
      const go = $('#slotGo');
      if(go) go.dataset.id = r.id;
      state.lastRecipe = r.id;
      saveState();
      slotSpinning = false;
      toast('抽到今天吃：' + r.name);
    }, 980);
  },
  openRecipe(el){ navigate('recipe', { id:el.dataset.id }); },
  openRecipeVideo(el){ recipeVideoSheet(el.dataset.id); },
  goCat(el){ const p = {}; if(el.dataset.cat && el.dataset.cat !== '全部') p.cat = el.dataset.cat; if(el.dataset.sub) p.sub = el.dataset.sub; navigate('category', p); },
  goOrder(el){ navigate('order', { tab:el.dataset.tab || 'all' }); },
  quick(el){
    if(el.dataset.all === '1') return navigate('category', {});
    const p = {}; if(el.dataset.cat) p.cat = el.dataset.cat; if(el.dataset.sub) p.sub = el.dataset.sub;
    navigate('category', p);
  },
  circle(el){
    const p = {};
    if(el.dataset.cat && el.dataset.cat !== '全部') p.cat = el.dataset.cat;
    if(el.dataset.sub) p.sub = el.dataset.sub;
    navigate('category', p);
  },
  side(el){
    const p = {}; if(currentParams.cat) p.cat = currentParams.cat; p.sub = el.dataset.sub;
    navigate('category', p);
  },
  sort(el){
    const p = {};
    if(currentParams.cat) p.cat = currentParams.cat;
    if(currentParams.sub) p.sub = currentParams.sub;
    let sort = el.dataset.sort;
    if(sort === 'price') sort = currentParams.sort === 'priceAsc' ? 'priceDesc' : 'priceAsc';
    if(sort !== 'default') p.sort = sort;
    navigate('category', p);
  },
  heroDot(el){ setHero(Number(el.dataset.i)); },
  heroTap(el){ navigate('category', { cat:el.dataset.cat }); },
  searchFocus(){ navigate('search'); },
  hotWord(el){ navigate('search', { q:el.dataset.word }); },
  detail(el){ navigate('detail', { id:el.dataset.id }); },
  quickAdd(el){
    const p = BY_ID[el.dataset.id]; if(!p) return;
    addToCart(p.id, p.specs[0], 1, true);
    renderDock(currentView);
    toast(`已加入购物车：${p.name.slice(0, 12)}${p.name.length > 12 ? '…' : ''}`);
  },
  openSku(el){ openSku(el.dataset.id, el.dataset.mode || 'cart'); },
  skuSpec(el){
    skuState.spec = findSpec(BY_ID[skuState.id], el.dataset.spec);
    $$('.chips .chip').forEach(c => c.classList.toggle('is-on', c.dataset.spec === skuState.spec));
    const sel = $('#skuSelected');
    if(sel) sel.textContent = `已选：${skuState.spec} × ${skuState.qty}`;
  },
  skuQty(el){
    const d = Number(el.dataset.d);
    skuState.qty = Math.min(99, Math.max(1, skuState.qty + d));
    const q = $('#skuQty'); if(q) q.textContent = skuState.qty;
    const sel = $('#skuSelected'); if(sel) sel.textContent = `已选：${skuState.spec} × ${skuState.qty}`;
  },
  skuConfirm(el){
    const p = BY_ID[skuState.id]; if(!p) return;
    const mode = el.dataset.mode || skuState.mode;
    addToCart(p.id, skuState.spec, skuState.qty, true);
    closeSheet();
    renderDock(currentView);
    if(mode === 'buy'){
      state.cart.forEach(it => { it.checked = (it.key === p.id + '::' + skuState.spec); });
      saveState();
      navigate('checkout');
    }else{
      toast('已加入购物车');
    }
  },
  closeSheet(){ closeSheet(); },
  cartCheck(el){
    const it = state.cart.find(x => x.key === el.dataset.key); if(!it) return;
    it.checked = !it.checked; saveState(); softRender();
  },
  cartPlus(el){
    const it = state.cart.find(x => x.key === el.dataset.key); if(!it) return;
    it.qty = Math.min(99, it.qty + 1); saveState(); softRender();
  },
  cartMinus(el){
    const it = state.cart.find(x => x.key === el.dataset.key); if(!it) return;
    it.qty = Math.max(1, it.qty - 1); saveState(); softRender();
  },
  cartRemove(el){
    state.cart = state.cart.filter(x => x.key !== el.dataset.key); saveState(); softRender(); toast('已从购物车移除');
  },
  cartCheckAll(){
    const items = state.cart.filter(it => BY_ID[it.id]);
    const allOn = items.length > 0 && items.every(it => it.checked);
    items.forEach(it => it.checked = !allOn);
    saveState(); softRender();
  },
  checkout(){
    const t = checkoutTotals();
    if(!t.items.length) return toast('请先勾选要结算的商品');
    if(!state.user.address) return toast('请先添加收货地址');
    navigate('checkout');
  },
  submitOrder(){
    const t = checkoutTotals();
    if(!t.items.length) return toast('没有可结算的商品');
    if(!state.user.address) return toast('请先添加收货地址');
    const note = $('#orderNote') ? $('#orderNote').value.trim() : '';
    const order = {
      id:'o' + Date.now(),
      no:createOrderNo(),
      items:t.items.map(it => ({ id:it.id, spec:it.spec, qty:it.qty, price:BY_ID[it.id].price })),
      subtotal:t.subtotal, freight:t.freight, discount:t.coupon ? t.coupon.amt : 0, total:t.total,
      status:'pending', createdAt:Date.now(),
      address: clone(state.user.address), note
    };
    state.orders.unshift(order);
    if(t.coupon) state.usedCoupons.push(t.coupon.id);
    state.selectedCoupon = null;
    state.cart = state.cart.filter(it => !it.checked);
    saveState();
    navigate('order', { tab:'pending' });
    setTimeout(() => toast('订单已提交，请在 30 分钟内完成支付'), 320);
  },
  orderTab(el){ navigate('order', { tab:el.dataset.tab }); },
  payOrder(el){
    const o = state.orders.find(x => x.id === el.dataset.id); if(!o) return;
    openPay(o);
  },
  payMethod(el){
    payState.method = el.dataset.method;
    $$('.pay-list .pay-item').forEach(p => p.classList.toggle('is-on', p.dataset.method === payState.method));
  },
  doPay(){
    const o = state.orders.find(x => x.id === payState.id); if(!o) return;
    if(payState.method === 'balance' && state.balance < o.total){ return toast('余额不足，请先充值或改用微信支付'); }
    if(payState.method === 'balance'){
      state.balance = Math.round((state.balance - o.total) * 100) / 100;
      state.ledger.unshift({ type:'消费', amt:o.total, time:orderTime(Date.now()), note:'订单 ' + o.no });
    }
    o.status = 'shipping';
    o.paidAt = Date.now();
    saveState(); closeSheet(); softRender();
    toast(payState.method === 'balance' ? '余额支付成功' : '支付成功，商家正在备货');
  },
  cancelOrder(el){
    const o = state.orders.find(x => x.id === el.dataset.id); if(!o) return;
    dialog('取消订单', '取消后订单不可恢复，已使用的优惠券不会退回。', '确认取消', () => {
      o.status = 'canceled'; saveState(); softRender(); toast('订单已取消');
    });
  },
  demoShip(el){
    const o = state.orders.find(x => x.id === el.dataset.id); if(!o) return;
    o.status = 'receiving'; saveState(); softRender(); toast('演示：商家已发货');
  },
  confirmOrder(el){
    const o = state.orders.find(x => x.id === el.dataset.id); if(!o) return;
    o.status = 'done'; o.finishedAt = Date.now(); saveState(); softRender(); toast('已确认收货');

  rebuy(el){

    saveState(); closeSheet(); softRender(); toast('地址已保存');
  },
  bindAuto(){
    state.user.phone = state.user.phone || '15625397981';
    saveState();
    navigate('profile');
    setTimeout(() => toast('已授权绑定本机微信手机号'), 320);
  },
  bindManual(){
    openSheet(`<div class="sheet">
      <button class="sheet-close" data-act="closeSheet">${icon('close')}</button>
      <div class="sheet-head"><div><p class="sheet-title">手动绑定手机号</p><p class="sheet-desc">请输入 11 位手机号，验证码演示为任意 4 位数字</p></div></div>
      <div class="sheet-body">
        <div class="sheet-form">
          <div class="field"><label>手机号</label><input id="bindPhone" inputmode="numeric" maxlength="11" placeholder="请输入手机号" value="${esc(state.user.phone || '')}"></div>
          <div class="field field--code"><label>验证码</label><input id="bindCode" inputmode="numeric" maxlength="6" placeholder="4-6 位验证码"><button id="sendCodeBtn" data-act="sendCode">获取验证码</button></div>
        </div>
        <p class="sku-tip">演示环境不会真实发送短信，点击获取后填写任意 4 位数字即可。</p>
      </div>
      <div class="sheet-foot"><button class="sheet-btn sheet-btn--red" data-act="doBind">确认绑定</button></div>
    </div>`);
  },
  sendCode(){
    if(codeLeft > 0) return;
    const phone = $('#bindPhone') ? $('#bindPhone').value.trim() : '';
    if(!/^1\d{10}$/.test(phone)) return toast('请先填写正确的手机号');
    codeLeft = 60;
    const btn = $('#sendCodeBtn');
    if(btn){ btn.disabled = true; btn.textContent = `${codeLeft}s`; }
    clearInterval(codeTimer);
    codeTimer = setInterval(() => {
      codeLeft -= 1;
      const b = $('#sendCodeBtn');
      if(!b || codeLeft <= 0){ clearInterval(codeTimer); if(b){ b.disabled = false; b.textContent = '获取验证码'; } return; }
      b.textContent = `${codeLeft}s`;
    }, 1000);
    toast('验证码已发送（演示）');
  },
  doBind(){
    const phone = $('#bindPhone') ? $('#bindPhone').value.trim() : '';
    const code = $('#bindCode') ? $('#bindCode').value.trim() : '';
    if(!/^1\d{10}$/.test(phone)) return toast('请填写正确的手机号');
    if(code.length < 4) return toast('请输入 4 位演示验证码');
    state.user.phone = phone; saveState(); closeSheet(); navigate('profile');
    setTimeout(() => toast('手机号绑定成功'), 320);
  },
  rechargeSheet(){ rechargeSheet(); },
  pickAmount(el){
    rechargeValue = Number(el.dataset.v);
    $$('.amounts .amount').forEach(a => a.classList.toggle('is-on', Number(a.dataset.v) === rechargeValue));
    const btn = $('#rechargeBtn'); if(btn) btn.textContent = `确认充值 ¥${yuan(rechargeValue)}`;
  },
  doRecharge(){
    state.balance = Math.round((state.balance + rechargeValue) * 100) / 100;
    state.ledger.unshift({ type:'充值', amt:rechargeValue, time:orderTime(Date.now()), note:'在线充值' });
    saveState(); closeSheet(); softRender(); toast(`充值成功 ¥${yuan(rechargeValue)}`);
  },
  withdrawSheet(){ withdrawSheet(); },
  doWithdraw(){
    const v = Number($('#withdrawInput') ? $('#withdrawInput').value : 0);
    if(!v || v <= 0) return toast('请输入提现金额');
    if(v > state.balance) return toast('可提现余额不足');
    state.balance = Math.round((state.balance - v) * 100) / 100;
    state.ledger.unshift({ type:'提现', amt:v, time:orderTime(Date.now()), note:'提现到微信零钱' });
    saveState(); closeSheet(); softRender(); toast('提现申请已提交（演示）');
  },
  ledgerSheet(el){ ledgerSheet(el.dataset.kind); },
  fav(el){
    state.favorites = state.favorites || [];
    const id = el.dataset.id;
    const i = state.favorites.indexOf(id);
    if(i > -1){ state.favorites.splice(i, 1); toast('已取消收藏'); }
    else { state.favorites.push(id); toast('已收藏，可在个人中心查看'); }
    saveState();
  },
  logout(){
    dialog('退出登录', '退出后需重新授权才能查看订单，购物车会保留。', '退出', () => {
      toast('已退出登录（演示模式）');
    });
  },
  dialogOk(){ if(pendingDialog) pendingDialog(); pendingDialog = null; closeSheet(); },
  demo(el){ toast(el.dataset.msg || '演示功能'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const fn = ACTIONS[el.dataset.act];
  if(!fn) return;
  e.preventDefault();
  fn(el, e);
});

document.addEventListener('input', e => {
  if(e.target.id === 'orderSearch'){
    const q = e.target.value.trim();
    let visible = 0;
    $$('.order-card').forEach(card => {
      const hit = !q || (card.dataset.search || '').includes(q);
      card.style.display = hit ? '' : 'none';
      if(hit) visible++;
    });
    const list = $('#orderList');
    let tip = $('#orderSearchEmpty');
    if(!visible){
      if(!tip && list){
        tip = document.createElement('div');
        tip.id = 'orderSearchEmpty';
        tip.className = 'search-empty';
        tip.textContent = '没有找到匹配的订单';
        list.appendChild(tip);
      }
    }else if(tip){ tip.remove(); }
  }
  if(e.target.id === 'searchInput'){
    const box = $('#searchResults');
    if(box) box.innerHTML = searchResultsHTML(e.target.value.trim());
  }
  if(e.target.id === 'helpPhoto'){
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    const room = 3 - helpUploads.length;
    if(room <= 0) return toast('最多上传 3 张照片');
    Promise.all(files.slice(0, room).map(file => new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve('');
      reader.readAsDataURL(file);
    }))).then(list => {
      helpUploads = helpUploads.concat(list.filter(Boolean)).slice(0, 3);
      const box = $('#helpPhotoPreview');
      if(box) box.innerHTML = helpPhotoGridHTML();
    });
    e.target.value = '';
  }
});

boot();
